<html lang="de">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Prompterator verwandelt Rohinput in Problemklasse, Arbeitsmodus, Artefakt-Blueprint, Qualitätsprüfung, Governance und Masterprompt.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.prompterator.de/">
  <meta property="og:title" content="Prompterator – KI Prompt Generator">
  <meta property="og:description" content="Rohinput rein. Strukturierte Arbeitsartefakte raus: Problemklasse, Modus, Blueprint, Governance und Masterprompt.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.prompterator.de/">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Prompterator",
    "applicationCategory": "ProductivityApplication",
    "operatingSystem": "Web",
    "url": "https://www.prompterator.de/",
    "description": "Prompterator verwandelt Rohinput in Problemklasse, Arbeitsmodus, Artefakt-Blueprint, Qualitätsprüfung, Governance und Masterprompt.",
    "creator": {"@type": "Person", "name": "Peter Fischer"}
  }
  </script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #12324a, #050812 60%);
      color: #e8f2ff;
      min-height: 100vh;
      padding: 32px;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 48px; line-height: 1; margin-bottom: 8px; }
    p { color: #a9bfd6; }
    textarea {
      width: 100%;
      min-height: 180px;
      border-radius: 16px;
      border: 1px solid #1f6f95;
      background: #07111f;
      color: #e8f2ff;
      padding: 16px;
      font-size: 16px;
      box-sizing: border-box;
    }
    textarea::placeholder { color: #6f879f; opacity: 1; }
    button {
      margin-top: 14px;
      padding: 12px 18px;
      border-radius: 12px;
      border: 0;
      background: linear-gradient(135deg, #20d8ff, #3ef0a1);
      font-weight: 800;
      cursor: pointer;
    }
    pre {
      margin-top: 20px;
      white-space: pre-wrap;
      background: rgba(5, 12, 22, 0.85);
      border: 1px solid rgba(32, 216, 255, 0.25);
      border-radius: 18px;
      padding: 18px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p>GosseOS / KnowledgeOS / Operator Fischer</p>
    <h1>Prompterator</h1>
    <p>KI Prompt Generator für strukturierte Arbeitsartefakte: Rohinput rein, Problemklasse, Modus, Artefakt-Blueprint, Governance und Masterprompt raus.</p>

    <textarea id="raw" placeholder="Hier Text eingeben"></textarea>
    <br>
    <button onclick="run()">Generieren</button>

    <pre id="out">Noch kein Output.</pre>
  </div>

<script>
let workingTimer = null;

function startWorkingAnimation(out) {
  let dots = 0;
  out.textContent = "Arbeite";
  workingTimer = setInterval(() => {
    dots = (dots + 1) % 4;
    out.textContent = "Arbeite" + ".".repeat(dots);
  }, 400);
}

function stopWorkingAnimation() {
  if (workingTimer) {
    clearInterval(workingTimer);
    workingTimer = null;
  }
}

async function run() {
  const raw_input = document.getElementById("raw").value.trim();
  const out = document.getElementById("out");

  if (!raw_input) {
    out.textContent = "Bitte erst Text eingeben.";
    return;
  }

  startWorkingAnimation(out);

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({raw_input})
    });

    const data = await res.json();
    stopWorkingAnimation();
    out.textContent = data.result || data.error || JSON.stringify(data, null, 2);
  } catch (err) {
    stopWorkingAnimation();
    out.textContent = "Fehler: " + err.message;
  }
}
</script>
</body>
</html>
