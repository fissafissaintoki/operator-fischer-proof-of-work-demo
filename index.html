<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Prompterator – Control Interface</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prompterator verwandelt Rohinput in strukturierte Arbeitsartefakte.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.prompterator.de/">
  <meta property="og:title" content="Prompterator – Control Interface">
  <meta property="og:description" content="Rohinput rein. Arbeitsartefakt raus.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.prompterator.de/">
  <meta property="og:image" content="https://www.prompterator.de/assets/ffooc-banner.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root{--bg:#02050a;--panel2:rgba(2,8,16,.82);--line:rgba(34,221,255,.24);--text:#edf8ff;--muted:#9fb4c7;--dim:#63798e;--cyan:#22ddff;--green:#3ef0a1;--amber:#ffbf4d;--orange:#ff7a18}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0%,rgba(34,221,255,.18),transparent 28%),radial-gradient(circle at 88% 0%,rgba(255,122,24,.15),transparent 24%),linear-gradient(135deg,#02050a,#07111f 56%,#080604)}body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(34,221,255,.045) 1px,transparent 1px),linear-gradient(rgba(34,221,255,.035) 1px,transparent 1px);background-size:48px 48px;opacity:.55;mask-image:linear-gradient(180deg,black,transparent 90%)}
    .shell{width:min(920px,calc(100% - 28px));margin:0 auto;padding:28px 0 46px}
    .card{border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(8,20,33,.92),rgba(3,8,14,.92));box-shadow:0 28px 100px rgba(0,0,0,.42),inset 0 0 0 1px rgba(255,255,255,.03);overflow:hidden}
    .banner-wrap{padding:18px 18px 0;background:linear-gradient(180deg,rgba(0,0,0,.72),transparent)}
    .hero-banner{display:block;width:100%;height:auto;border-radius:18px;border:1px solid rgba(255,191,77,.24);background:#000;box-shadow:0 18px 70px rgba(0,0,0,.45),0 0 38px rgba(255,191,77,.12)}
    header{padding:24px 30px 20px;border-bottom:1px solid rgba(34,221,255,.12);text-align:center}
    .kicker{margin:0 0 10px;color:var(--green);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(42px,8vw,76px);line-height:.92;font-weight:1000;letter-spacing:.02em;text-transform:uppercase;position:relative;display:inline-block;isolation:isolate}
    h1 span{display:inline-block;text-shadow:0 0 12px currentColor,0 0 28px rgba(255,255,255,.18)}
    h1::after{content:"";position:absolute;inset:-6px -10px;pointer-events:none;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.30) 50%,transparent 62%);transform:translateX(-120%);animation:shimmer 6s ease-in-out infinite;mix-blend-mode:screen;border-radius:14px}
    @keyframes shimmer{0%{transform:translateX(-120%)}55%{transform:translateX(120%)}100%{transform:translateX(120%)}}
    .claim{max-width:720px;margin:14px auto 0;color:var(--muted);font-size:15px;line-height:1.55}
    .main{padding:24px 30px 30px;display:grid;gap:18px}
    .block{border:1px solid rgba(34,221,255,.18);border-radius:20px;background:rgba(2,8,16,.58);padding:18px}
    .block-title{margin:0 0 10px;color:#dff7ff;font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    textarea,pre{width:100%;min-height:200px;border:1px solid rgba(34,221,255,.24);border-radius:16px;padding:16px;color:var(--text);background:var(--panel2);outline:none;font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;box-shadow:inset 0 0 28px rgba(0,0,0,.28)}
    textarea{resize:vertical}
    textarea::placeholder{color:#6e879d}
    textarea:focus{border-color:rgba(34,221,255,.78);box-shadow:0 0 0 4px rgba(34,221,255,.10),inset 0 0 28px rgba(0,0,0,.28)}
    pre{margin:0;white-space:pre-wrap;word-break:break-word;border-color:rgba(255,191,77,.22);min-height:240px}
    .actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
    button{border:0;border-radius:14px;padding:12px 16px;cursor:pointer;font-weight:950;transition:transform 120ms ease,filter 120ms ease}
    button:hover{transform:translateY(-1px);filter:brightness(1.06)}
    .primary{color:#021017;background:linear-gradient(135deg,var(--cyan),var(--green));box-shadow:0 0 30px rgba(34,221,255,.20)}
    .copy{color:#171000;background:linear-gradient(135deg,var(--amber),var(--orange))}
    .hint{color:var(--dim);font-size:12px;line-height:1.45}
    #copyStatus{color:var(--amber);font-size:13px;min-height:18px}
    footer{margin-top:16px;text-align:center;color:var(--dim);font-size:12px}
    @media(max-width:640px){
      .shell{width:min(100% - 20px,920px);padding-top:14px}
      .banner-wrap{padding:12px 12px 0}
      header,.main{padding-left:16px;padding-right:16px}
      h1{font-size:40px}
      .actions{align-items:flex-start;flex-direction:column}
      textarea,pre{min-height:180px}
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="banner-wrap">
        <img class="hero-banner" src="/assets/ffooc-banner.jpg" alt="FissaFissa Out of Control Werbebanner">
      </div>
      <header>
        <p class="kicker">Control Interface</p>
        <h1 aria-label="Prompterator"><span style="color:#22ddff">P</span><span style="color:#38bdf8">r</span><span style="color:#b388ff">o</span><span style="color:#ff6bd3">m</span><span style="color:#ff5e6c">p</span><span style="color:#ff7a18">t</span><span style="color:#ffbf4d">e</span><span style="color:#fcd34d">r</span><span style="color:#3ef0a1">a</span><span style="color:#5eead4">t</span><span style="color:#38bdf8">o</span><span style="color:#b388ff">r</span></h1>
        <p class="claim">Gib Rohinput ein. Prompterator macht daraus eine strukturierte Arbeitsfassung mit Problemklasse, Artefakt, Prüfung und nächsten Schritten.</p>
      </header>
      <div class="main">
        <section class="block">
          <h2 class="block-title">Input</h2>
          <textarea id="raw" placeholder="Hier Text eingeben"></textarea>
          <div class="actions">
            <button class="primary" onclick="run()">Generieren</button>
            <span class="hint">Rohinput → strukturierter Output</span>
          </div>
        </section>
        <section class="block">
          <h2 class="block-title">Output</h2>
          <pre id="out">Noch kein Output.</pre>
          <div class="actions">
            <span id="copyStatus"></span>
            <button class="copy" onclick="copyOutput()">Output kopieren</button>
          </div>
        </section>
      </div>
    </section>
    <footer>Operator Fischer · Prompterator</footer>
  </main>
<script>
let workingTimer=null;
function startWorkingAnimation(out){let dots=0;out.textContent="Arbeite";workingTimer=setInterval(()=>{dots=(dots+1)%4;out.textContent="Arbeite"+".".repeat(dots)},400)}
function stopWorkingAnimation(){if(workingTimer){clearInterval(workingTimer);workingTimer=null}}
async function run(){
  const raw_input=document.getElementById("raw").value.trim();
  const out=document.getElementById("out");
  const copyStatus=document.getElementById("copyStatus");
  copyStatus.textContent="";
  if(!raw_input){out.textContent="Bitte erst Text eingeben.";return}
  startWorkingAnimation(out);
  try{
    const res=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({raw_input})});
    const data=await res.json();
    stopWorkingAnimation();
    out.textContent=data.result||data.error||JSON.stringify(data,null,2);
  }catch(err){
    stopWorkingAnimation();
    out.textContent="Fehler: "+err.message;
  }
}
async function copyOutput(){
  const out=document.getElementById("out");
  const copyStatus=document.getElementById("copyStatus");
  const text=out.textContent.trim();
  if(!text||text==="Noch kein Output."){copyStatus.textContent="Noch kein Output zum Kopieren.";return}
  try{
    await navigator.clipboard.writeText(text);
    copyStatus.textContent="Kopiert.";
    setTimeout(()=>{copyStatus.textContent=""},1800);
  }catch(err){
    copyStatus.textContent="Bitte Output manuell markieren.";
  }
}
</script>
</body>
</html>
