<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Prompterator – KI Prompt Generator für strukturierte Arbeitsartefakte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prompterator verwandelt Rohinput in Problemklasse, Arbeitsmodus, Artefakt-Blueprint, Qualitätsprüfung, Governance und Masterprompt.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.prompterator.de/">
  <meta property="og:title" content="Prompterator – KI Prompt Generator">
  <meta property="og:description" content="Rohinput rein. Strukturierte Arbeitsartefakte raus: Problemklasse, Modus, Blueprint, Governance und Masterprompt.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.prompterator.de/">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Prompterator",
    "applicationCategory": "ProductivityApplication",
    "operatingSystem": "Web",
    "url": "https://www.prompterator.de/",
    "description": "Prompterator verwandelt Rohinput in Problemklasse, Arbeitsmodus, Artefakt-Blueprint, Qualitätsprüfung, Governance und Masterprompt.",
    "creator": {"@type": "Person", "name": "Peter Fischer"}
  }
  </script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(255, 196, 64, 0.35), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(255, 120, 0, 0.30), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(32, 216, 255, 0.15), transparent 38%),
        linear-gradient(135deg, #160d03, #07111f 48%, #050812 100%);
      color: #e8f2ff;
      min-height: 100vh;
      padding: 32px;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        repeating-linear-gradient(135deg, rgba(255, 212, 90, 0.06) 0 18px, transparent 18px 36px),
        repeating-linear-gradient(45deg, rgba(58, 82, 40, 0.12) 0 22px, transparent 22px 44px);
      animation: pulseBg 8s ease-in-out infinite;
    }
    @keyframes pulseBg {
      0%, 100% { transform: translate(0, 0); opacity: 0.72; }
      50% { transform: translate(-8px, 4px); opacity: 0.95; }
    }
    @keyframes flameFlicker {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 112, 0, 0.65)); transform: skewX(-2deg) scale(1); }
      35% { filter: drop-shadow(0 0 22px rgba(255, 191, 0, 0.95)); transform: skewX(1deg) scale(1.012); }
      70% { filter: drop-shadow(0 0 16px rgba(255, 55, 0, 0.85)); transform: skewX(-1deg) scale(1.006); }
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    .topline { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 12px; }
    .system-label { color: #a9bfd6; margin: 0; }
    .ff-badge {
      border: 1px solid rgba(255, 196, 64, 0.55);
      border-radius: 12px;
      padding: 9px 12px;
      background: linear-gradient(135deg, rgba(255, 136, 0, 0.22), rgba(7, 17, 31, 0.88));
      color: #ffe6a0;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255, 136, 0, 0.8);
      white-space: nowrap;
    }
    h1 {
      font-size: 68px;
      line-height: 0.95;
      margin: 0 0 12px;
      font-weight: 1000;
      letter-spacing: -0.055em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff6b7 0%, #ffd45a 22%, #ff8a00 48%, #ff3b00 72%, #3a0800 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 229, 145, 0.62);
      text-shadow:
        0 0 8px rgba(255, 238, 160, 0.55),
        0 0 18px rgba(255, 136, 0, 0.95),
        0 0 38px rgba(255, 56, 0, 0.78),
        0 4px 0 rgba(44, 8, 0, 0.95);
      animation: flameFlicker 2.8s ease-in-out infinite;
    }
    p { color: #a9bfd6; }
    .panel {
      background: rgba(5, 12, 22, 0.82);
      border: 1px solid rgba(255, 196, 64, 0.25);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.34);
    }
    textarea {
      width: 100%;
      min-height: 180px;
      border-radius: 16px;
      border: 1px solid rgba(255, 196, 64, 0.42);
      background: #07111f;
      color: #e8f2ff;
      padding: 16px;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
    }
    textarea:focus { border-color: #ffd45a; box-shadow: 0 0 0 4px rgba(255, 212, 90, 0.12); }
    textarea::placeholder { color: #6f879f; opacity: 1; }
    button {
      margin-top: 14px;
      padding: 12px 18px;
      border-radius: 12px;
      border: 0;
      background: linear-gradient(135deg, #20d8ff, #3ef0a1);
      color: #03111a;
      font-weight: 900;
      cursor: pointer;
    }
    button.copy {
      background: linear-gradient(135deg, #ffd45a, #ff8a00);
      color: #1b1000;
    }
    pre {
      margin-top: 20px;
      white-space: pre-wrap;
      background: rgba(5, 12, 22, 0.88);
      border: 1px solid rgba(255, 196, 64, 0.28);
      border-radius: 18px;
      padding: 18px;
      line-height: 1.5;
      min-height: 130px;
    }
    .copy-row { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 10px; }
    #copyStatus { color: #ffd45a; font-size: 13px; }
    @media (max-width: 720px) {
      body { padding: 18px; }
      .topline { flex-direction: column; align-items: flex-start; }
      .ff-badge { white-space: normal; }
      h1 { font-size: 46px; }
      .copy-row { justify-content: flex-start; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topline">
      <p class="system-label">GosseOS / KnowledgeOS / Operator Fischer</p>
      <div class="ff-badge">FF-OOC</div>
    </div>

    <div class="panel">
      <h1>Prompterator</h1>
      <p>KI Prompt Generator für strukturierte Arbeitsartefakte: Rohinput rein, Problemklasse, Modus, Artefakt-Blueprint, Governance und Masterprompt raus.</p>

      <textarea id="raw" placeholder="Hier Text eingeben"></textarea>
      <br>
      <button onclick="run()">Generieren</button>

      <pre id="out">Noch kein Output.</pre>
      <div class="copy-row">
        <span id="copyStatus"></span>
        <button class="copy" onclick="copyOutput()">Output kopieren</button>
      </div>
    </div>
  </div>

<script>
let workingTimer = null;

function startWorkingAnimation(out) {
  let dots = 0;
  out.textContent = "Arbeite";
  workingTimer = setInterval(() => {
    dots = (dots + 1) % 4;
    out.textContent = "Arbeite" + ".".repeat(dots);
  }, 400);
}

function stopWorkingAnimation() {
  if (workingTimer) {
    clearInterval(workingTimer);
    workingTimer = null;
  }
}

async function run() {
  const raw_input = document.getElementById("raw").value.trim();
  const out = document.getElementById("out");
  const copyStatus = document.getElementById("copyStatus");
  copyStatus.textContent = "";

  if (!raw_input) {
    out.textContent = "Bitte erst Text eingeben.";
    return;
  }

  startWorkingAnimation(out);

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({raw_input})
    });

    const data = await res.json();
    stopWorkingAnimation();
    out.textContent = data.result || data.error || JSON.stringify(data, null, 2);
  } catch (err) {
    stopWorkingAnimation();
    out.textContent = "Fehler: " + err.message;
  }
}

async function copyOutput() {
  const out = document.getElementById("out");
  const copyStatus = document.getElementById("copyStatus");
  const text = out.textContent.trim();

  if (!text || text === "Noch kein Output.") {
    copyStatus.textContent = "Noch kein Output zum Kopieren.";
    return;
  }

  try {
    await navigator.clipboard.writeText(text);
    copyStatus.textContent = "Kopiert.";
    setTimeout(() => { copyStatus.textContent = ""; }, 1800);
  } catch (err) {
    copyStatus.textContent = "Bitte Output manuell markieren.";
  }
}
</script>
</body>
</html>
